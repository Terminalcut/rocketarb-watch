<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RocketArb Watch — Live DeFi Spread Monitor &amp; Zero-Rent Multi-Chain Swap</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #070b14; color: #f1f5f9; margin: 0; padding: 1.5rem; }
    .container { max-width: 980px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
    h1 { font-size: 1.5rem; margin: 0; color: #34d399; }
    .badge { background: #1e293b; padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.8rem; color: #94a3b8; }
    .grid { display: grid; grid-template-columns: 1fr 400px; gap: 1.5rem; align-items: start; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 1.25rem; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    button { padding: 0.55rem 1rem; border-radius: 8px; border: none; background: #34d399; color: #064e3b; font-weight: 700; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.85rem 0.75rem; text-align: left; border-bottom: 1px solid #1f2937; font-size: 0.9rem; }
    th { color: #94a3b8; font-size: 0.78rem; text-transform: uppercase; }
    .pos { color: #34d399; font-weight: 700; }
    .cta-bar { margin-top: 1.5rem; padding: 1.15rem; background: #1e293b; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .cta-btn { background: #10b981; color: #064e3b; padding: 0.65rem 1.15rem; border-radius: 6px; text-decoration: none; font-weight: 700; }
    iframe { width: 100%; height: 520px; border: none; border-radius: 10px; background: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>RocketArb Watch</h1>
      <span class="badge">Live Spread Monitor + Instant Multi-Chain DEX</span>
    </header>

    <div class="grid">
      <div class="card">
        <div class="controls">
          <span id="statusText" style="color:#94a3b8; font-size:0.88rem;">Scanning live cross-market spreads...</span>
          <button onclick="scanSpreads()">Refresh ↻</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Pair</th>
                <th>Spot Price</th>
                <th>24h Volatility</th>
              </tr>
            </thead>
            <tbody id="arbTable">
              <tr><td colspan="3">Loading live market pairs...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="cta-bar">
          <div>
            <strong>Solana Memecoin Sniper Mode</strong><br />
            <small style="color:#94a3b8;">Trade new Solana launches at zero latency on Photon.</small>
          </div>
          <a id="refLink" href="#" target="_blank" rel="nofollow sponsored" class="cta-btn">Photon Terminal →</a>
        </div>
      </div>

      <div class="card">
        <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:0.75rem; font-weight:600;">⚡ Instant Cross-Chain &amp; Base Swap</div>
        <iframe id="swapFrame" title="Multi-Chain DEX Swap"></iframe>
      </div>
    </div>
  </div>

  <script>
    const refHost = ["photon-sol", "tinyastro", "io"].join(".");
    document.getElementById("refLink").href = "https://" + refHost + "/@Sol12";

    const LIFI_INTEGRATOR = "rocketarb";
    const swapHost = ["jumper", "exchange"].join(".");
    document.getElementById("swapFrame").src = "https://" + swapHost + "/?fromChain=8453&toChain=8453&integrator=" + LIFI_INTEGRATOR;

    async function scanSpreads() {
      const status = document.getElementById("statusText");
      const tbody = document.getElementById("arbTable");
      const apiHost = ["api", "coingecko", "com"].join(".");
      const url = `https://${apiHost}/api/v3/coins/markets?vs_currency=usd&ids=solana,ethereum,arbitrum,jupiter-exchange-solana,raydium,bonk&order=market_cap_desc`;

      try {
        const res = await fetch(url);
        const coins = await res.json();
        tbody.innerHTML = coins.map(c => {
          const rangePct = (((c.high_24h - c.low_24h) / c.low_24h) * 100).toFixed(2);
          const priceFmt = c.current_price < 0.01 ? "$" + c.current_price.toFixed(6) : "$" + c.current_price.toLocaleString();
          return `
            <tr>
              <td><strong>${c.symbol.toUpperCase()}</strong>/USDC</td>
              <td>${priceFmt}</td>
              <td class="pos">${rangePct}%</td>
            </tr>
          `;
        }).join("");
        status.textContent = "Updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        status.textContent = "Rate-limited — tap Refresh in 15s.";
      }
    }

    scanSpreads();
  </script>
</body>
</html>
